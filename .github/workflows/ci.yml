name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend on Node ${{ matrix.node-version }} (lint and build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  backend:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: backend
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # The tests download the Quran text (api.quran.com) and the Whisper model (Hugging Face) on
      # first use. Cache both so most runs do not depend on those services.
      - name: Cache the Quran text
        uses: actions/cache@v4
        with:
          path: backend/quran/quran_data.json
          key: quran-data-${{ hashFiles('backend/quran/loader.py') }}

      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: whisper-model-OdyAsh-faster-whisper-base-ar-quran-v1

      - name: Tests
        run: python -m pytest -v
